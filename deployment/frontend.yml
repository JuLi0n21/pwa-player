apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: osu-music
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        image: frontend
        ports:
        - containerPort: 80
