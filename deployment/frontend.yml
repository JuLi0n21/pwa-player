apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: osu-music
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        image: juli0n21/frontend-container:9cd067f250ca05ce6a5ded59ba9eefd89f7b4f07
        ports:
        - containerPort: 80
